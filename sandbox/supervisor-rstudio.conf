[program:rstudio]
; rserver as the session user (the same way jupyter-rsession-proxy runs it):
; server-user must match the invoking user, and every default path under
; /var/run, /var/lib/rstudio-server is moved to /tmp. auth-none and
; www-address=127.0.0.1 come from /etc/rstudio/rserver.conf.
command=/usr/lib/rstudio-server/bin/rserver --server-daemonize 0 --auth-pam-require-password-prompt 0 --server-user=rstudio --server-pid-file=/tmp/rstudio-server/rserver.pid --server-data-dir=/tmp/rstudio-server --database-config-file=/tmp/rstudio-server/database.conf --secure-cookie-key-file=/tmp/rstudio-server/secure-cookie-key --www-port=8787
[supervisord]
environment=USER="rstudio",HOME="/home/rstudio"
